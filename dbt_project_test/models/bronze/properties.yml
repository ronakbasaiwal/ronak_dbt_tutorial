models:
  - name: bronze_date #  Must match the filename of a model -- including case sensitivity.
    config:
      materialized: view 
    
  - name: bronze_sales #  Must match the filename of a model -- including case sensitivity.
    columns:
        - name : sales_id
          data_tests:
           - unique
           - not_null
        - name : gross_amount
          data_tests:
           - generic_nonnegative
  - name: bronze_store #  Must match the filename of a model -- including case sensitivity.
    columns:
        - name : store_sk
          data_tests:
                - unique
                - not_null
        - name: store_name
          data_tests:
                - accepted_values: 
                    arguments:
                        values: ['MegaMart Manhattan','MegaMart San Jose','MegaMart Toronto','MegaMart Austin','MegaMart Brooklyn']
                    config:
                        severity: warn
        - name: country
          data_tests:
                - accepted_values: 
                    arguments:
                        values: ['USA']
                    config:
                        severity: warn